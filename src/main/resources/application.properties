spring.application.name=timefit

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:timefit
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:ThisIsASuperStrongJWTSecretKeyForTimefit1234567890}
jwt.access-token-validity-in-ms=3600000
jwt.refresh-token-validity-in-ms=1209600000